<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Scanner - Miss Seven Queen</title>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script
      src="https://unpkg.com/html5-qrcode"
      type="text/javascript"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500;700&display=swap"
      rel="stylesheet" />

    <style>
      body {
        background: #111;
        color: #fff;
        font-family: "Prompt", sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      h1 {
        color: #d4af37;
        margin-bottom: 20px;
        font-size: 24px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* กรอบ Scanner */
      #reader {
        width: 100%;
        max-width: 500px;
        background: #000;
        border: 2px solid #d4af37;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
      }

      /* ซ่อนลิงก์รกๆ ของ Library */
      #reader__dashboard_section_csr span,
      #reader__dashboard_section_swaplink {
        display: none !important;
      }

      /* ปุ่มต่างๆ */
      .btn-gold {
        background: linear-gradient(45deg, #d4af37, #f9ea8f);
        color: #000;
        border: none;
        padding: 12px 25px;
        border-radius: 50px;
        font-family: "Prompt", sans-serif;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
        margin-top: 20px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        transition: 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
      }
      .btn-gold:active {
        transform: scale(0.95);
      }

      /* กล่องผลลัพธ์ */
      .result-box {
        margin-top: 20px;
        padding: 20px;
        border-radius: 10px;
        display: none;
        width: 100%;
        max-width: 460px;
        animation: fadeIn 0.5s;
      }
      .success {
        background: rgba(40, 167, 69, 0.1);
        border: 1px solid #28a745;
        color: #2ecc71;
      }
      .error {
        background: rgba(214, 48, 49, 0.1);
        border: 1px solid #d63031;
        color: #ff7675;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <h2 style="text-align: center">📷 ทดสอบกล้อง Basic</h2>

    <div
      id="reader"
      style="width: 100%; max-width: 500px; margin: 0 auto"></div>

    <p
      style="
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        margin-top: 20px;
      ">
      ผลลัพธ์: <span id="result" style="color: blue">ยังไม่มีข้อมูล</span>
    </p>

    <script>
      // ฟังก์ชันทำงานเมื่อสแกนเจอ
      function onScanSuccess(decodedText, decodedResult) {
        // โชว์ผลลัพธ์ออกมา
        console.log(`Scan result: ${decodedText}`, decodedResult);
        document.getElementById("result").innerText = decodedText;

        // (ถ้าอยากหยุดกล้องเมื่อเจอแล้ว ให้เปิดบรรทัดล่างนี้)
        // html5QrcodeScanner.clear();
      }

      function onScanFailure(error) {
        // ไม่ต้องทำอะไร ปล่อยให้มันสแกนต่อเรื่อยๆ
      }

      // เริ่มต้น Scanner แบบ Basic ที่สุด (ใช้ UI ของ Library เองเลย)
      let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
        },
        /* verbose= */ false,
      );

      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
  </body>
</html>
