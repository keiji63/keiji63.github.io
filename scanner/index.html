<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Scanner - Miss Seven Queen</title>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script
      src="https://unpkg.com/html5-qrcode"
      type="text/javascript"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500;700&display=swap"
      rel="stylesheet" />

    <style>
      body {
        background: #111;
        color: #fff;
        font-family: "Prompt", sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      h1 {
        color: #d4af37;
        margin-bottom: 20px;
        text-transform: uppercase;
      }

      #reader {
        width: 100%;
        max-width: 500px;
        background: #000;
        border: 2px solid #d4af37;
        border-radius: 10px;
        overflow: hidden;
      }

      #reader__dashboard_section_csr span,
      #reader__dashboard_section_swaplink {
        display: none !important;
      }

      /* ปุ่ม Manual */
      .btn-gold {
        background: linear-gradient(45deg, #d4af37, #f9ea8f);
        color: #000;
        border: none;
        padding: 12px 30px;
        border-radius: 50px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        margin-top: 15px;
        width: 100%;
        max-width: 300px;
      }
      .input-manual {
        background: #222;
        border: 1px solid #555;
        color: #fff;
        padding: 12px;
        border-radius: 10px;
        width: 100%;
        max-width: 280px;
        margin-top: 30px;
        text-align: center;
        font-size: 16px;
        font-family: "Prompt";
      }
      #manualArea {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center; /* บังคับทุกอย่างในนี้ให้อยู่กลาง */
      }
      .divider {
        margin: 20px auto;
        color: #555;
        font-size: 12px;
        display: flex;
        align-items: center;
        width: 100%;
        max-width: 300px;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #333;
      }
      .divider span {
        padding: 0 10px;
        color: #666;
        font-weight: 300;
      }
      /* --- 🎨 Custom SweetAlert Styles --- */
      div:where(.swal2-container) div:where(.swal2-popup) {
        background: #1a1a1a !important;
        border: 1px solid #d4af37;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        border-radius: 15px;
      }

      .swal-title-custom {
        color: #fff !important;
        font-size: 22px !important;
        font-weight: 600 !important;
        margin-bottom: 5px !important;
      }

      .swal-text-custom {
        color: #aaa !important;
        font-size: 14px !important;
        font-weight: 300 !important;
      }

      /* Wrapper เพื่อจัดตำแหน่งลูกศร */
      .custom-select-wrapper {
        position: relative;
        width: 80%;
        margin: 20px auto;
      }

      /* ตัว Dropdown (Select Box) */
      .style-select {
        width: 100%;
        padding: 12px 15px;
        font-family: "Prompt", sans-serif;
        font-size: 18px;
        font-weight: bold;
        color: #d4af37; /* ตัวหนังสือสีทอง */
        background-color: #000; /* พื้นหลังดำ */
        border: 1px solid #d4af37;
        border-radius: 50px; /* ทรงแคปซูล */
        appearance: none; /* ซ่อนลูกศรเดิมของ Browser */
        -webkit-appearance: none;
        -moz-appearance: none;
        cursor: pointer;
        text-align: center;
        outline: none;
        transition: 0.3s;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      }

      .style-select:focus {
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
      }

      /* สร้างลูกศรใหม่ด้วย CSS (หรือจะใช้ Icon ก็ได้) */
      .custom-arrow {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #d4af37;
        pointer-events: none; /* กดทะลุได้ */
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1><i class="fas fa-qrcode"></i> Check-in</h1>

    <div id="reader"></div>

    <button
      id="resetBtn"
      class="btn-gold"
      onclick="resetScanner()"
      style="display: none">
      <i class="fas fa-sync-alt"></i> เริ่มสแกนใหม่
    </button>

    <div id="manualArea">
      <div class="divider"><span>หรือ ค้นหาด้วยเบอร์โทร</span></div>
      <input
        type="tel"
        id="manualPhone"
        class="input-manual"
        placeholder="กรอกเบอร์โทรลูกค้า (10 หลัก)"
        maxlength="10" />
      <button
        class="btn-gold"
        style="background: #333; color: #d4af37; border: 1px solid #d4af37"
        onclick="manualCheckIn()">
        <i class="fas fa-search"></i> ค้นหาตั๋ว
      </button>
    </div>

    <script>
      const BACKEND_URL = "https://miss-seven-queen-api.vercel.app";
      let html5QrcodeScanner;
      let isProcessing = false;

      function onScanSuccess(decodedText, decodedResult) {
        if (!decodedText.includes("|") || isProcessing) return;
        isProcessing = true;
        if (html5QrcodeScanner) html5QrcodeScanner.pause();

        const parts = decodedText.split("|");
        if (parts.length < 2) {
          showError("QR Code ไม่ถูกต้อง");
          return;
        }
        performCheckIn(parts[0], parts[1]);
      }

      function manualCheckIn() {
        const phone = document.getElementById("manualPhone").value.trim();
        if (phone.length < 9) {
          Swal.fire({
            icon: "warning",
            title: "เบอร์โทรไม่ถูกต้อง",
            background: "#222",
            color: "#fff",
            confirmButtonColor: "#d4af37",
          });
          return;
        }

        Swal.fire({
          title: "กำลังค้นหา...",
          background: "#222",
          color: "#fff",
          didOpen: () => Swal.showLoading(),
        });

        fetch(`${BACKEND_URL}/api/check-ticket`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: phone }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.success && data.found) {
              const ticketId = data.data.ticketId;
              // รองรับทั้งแบบเก่า (String) และแบบใหม่ (Object)
              const seats = data.data.seatsDetail || data.data.seats;

              // 1. นับจำนวนที่นั่งที่ยังว่าง (ยังไม่ Check-in)
              const availableSeats = seats.filter((s) =>
                typeof s === "object" ? !s.checked : true,
              );
              const availableCount = availableSeats.length;

              // 🛑 CASE 1: ถ้าเช็คอินครบหมดแล้ว -> เด้งเตือนเลย ไม่ต้องไปต่อ
              if (availableCount === 0) {
                Swal.fire({
                  icon: "warning",
                  title: "Check-in ครบทุกที่นั่งแล้ว",
                  html: `
                                <div style="margin-bottom:10px;">คุณ <b>${data.data.name}</b></div>
                                <div style="color:#d63031; font-size:14px;">ได้ทำการ Check-in ครบทุกที่นั่งแล้ว</div>
                            `,
                  background: "#1a1a1a",
                  color: "#fff",
                  confirmButtonColor: "#555",
                  confirmButtonText: "ปิด",
                  timer: 3000, // ปิดเองใน 3 วิ
                  timerProgressBar: true,
                }).then(() => resetScanner());
                return; // จบการทำงานทันที
              }

              // ✅ CASE 2: ยังเหลือที่นั่ง -> สร้าง Dropdown ให้เลือก (เฉพาะที่ว่าง)
              let optionsHtml = seats
                .map((s) => {
                  const seatId = typeof s === "object" ? s.id : s;
                  const isChecked = typeof s === "object" ? s.checked : false;

                  if (isChecked) {
                    // อันที่เช็คแล้ว ใส่ disabled ไว้ (เผื่ออยากเห็น) หรือจะ filter ออกเลยก็ได้
                    return `<option value="${seatId}" disabled style="color: #d63031; background: #333;">❌ ${seatId} (Check-in แล้ว)</option>`;
                  } else {
                    // อันที่ว่าง ให้เลือกได้
                    return `<option value="${seatId}">${seatId}</option>`;
                  }
                })
                .join("");

              Swal.fire({
                title: `<div class="swal-title-custom">คุณ ${data.data.name}</div>`,
                html: `
                            <div class="swal-text-custom">เหลือ ${availableCount} ที่นั่งที่ยังไม่เข้างาน</div>
                            <div class="custom-select-wrapper">
                                <select id="seatSelector" class="style-select">
                                    ${optionsHtml}
                                </select>
                                <i class="fas fa-chevron-down custom-arrow"></i>
                            </div>
                        `,
                background: "#1a1a1a",
                showCancelButton: true,
                confirmButtonColor: "#28a745",
                confirmButtonText: 'Check-in <i class="fas fa-check"></i>',
                cancelButtonText: "ยกเลิก",
                cancelButtonColor: "#333",
                preConfirm: () => {
                  return document.getElementById("seatSelector").value;
                },
              }).then((result) => {
                if (result.isConfirmed) performCheckIn(ticketId, result.value);
                else resetScanner();
              });
            } else {
              Swal.fire({
                icon: "error",
                title: "ไม่พบข้อมูล",
                text: "ไม่พบตั๋วที่จองด้วยเบอร์นี้",
                background: "#222",
                color: "#fff",
              }).then(() => resetScanner());
            }
          })
          .catch((err) => showError("ค้นหาไม่สำเร็จ"));
      }

      // ✅ ฟังก์ชัน Check-in ที่ปรับแก้ Flow ใหม่
      function performCheckIn(ticketId, seatId) {
        Swal.fire({
          title: "กำลังตรวจสอบ...",
          html: `<div style="color:#aaa">Ticket: ${ticketId}</div><div style="font-size:24px; font-weight:bold; color:#d4af37; margin-top:10px;">ที่นั่ง ${seatId}</div>`,
          background: "#222",
          color: "#fff",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });

        fetch(`${BACKEND_URL}/api/check-in`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ticketId, seatId }),
        })
          .then((res) => res.json())
          .then((data) => {
            Swal.close();
            if (data.success) {
              // ✅ ผ่าน: ปุ่มเป็น "สแกนคนต่อไป" และกดแล้ว Reset ทันที
              Swal.fire({
                icon: "success",
                title: "ผ่าน! (Welcome)",
                html: `คุณ <b>${data.data.name}</b><br>ที่นั่ง: <b style="color:#d4af37; font-size:20px;">${data.data.seat}</b>`,
                background: "#222",
                color: "#fff",
                confirmButtonColor: "#28a745",
                confirmButtonText:
                  'สแกนคนต่อไป <i class="fas fa-arrow-right"></i>', // เปลี่ยนข้อความปุ่ม
                allowOutsideClick: false,
              }).then((result) => {
                if (result.isConfirmed) {
                  resetScanner(); // ⚡️ กดปุ๊บ กล้องทำงานต่อปั๊บ
                }
              });
              playSound(true);
            } else {
              // ❌ ไม่ผ่าน: ปุ่มเป็น "ลองใหม่"
              Swal.fire({
                icon: "error",
                title: "ไม่ผ่าน!",
                text: data.message,
                background: "#222",
                color: "#fff",
                confirmButtonColor: "#d63031",
                confirmButtonText: "ลองใหม่",
              }).then(() => resetScanner());
              playSound(false);
            }
          })
          .catch((err) => showError("เชื่อมต่อ Server ไม่ได้"));
      }

      function resetScanner() {
        document.getElementById("resetBtn").style.display = "none";
        document.getElementById("manualArea").style.display = "block";
        document.getElementById("manualPhone").value = "";
        isProcessing = false;

        if (html5QrcodeScanner) {
          try {
            html5QrcodeScanner.resume();
          } catch (e) {
            html5QrcodeScanner.clear().then((_) => initScanner());
          }
        }
      }

      function showError(msg) {
        Swal.fire({
          icon: "error",
          title: "Error",
          text: msg,
          background: "#222",
          color: "#fff",
        }).then(() => resetScanner());
      }

      function initScanner() {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          aspectRatio: 1.0,
          experimentalFeatures: { useBarCodeDetectorIfSupported: true },
          videoConstraints: {
            facingMode: "environment",
            width: { min: 640, ideal: 1280 },
            height: { min: 480, ideal: 720 },
          },
        });
        html5QrcodeScanner.render(onScanSuccess);
      }

      function playSound(success) {
        try {
          const context = new (
            window.AudioContext || window.webkitAudioContext
          )();
          const osc = context.createOscillator();
          const gain = context.createGain();
          osc.connect(gain);
          gain.connect(context.destination);
          osc.type = success ? "sine" : "sawtooth";
          osc.frequency.value = success ? 1000 : 200;
          gain.gain.setValueAtTime(0.1, context.currentTime);
          osc.start();
          osc.stop(context.currentTime + 0.2);
        } catch (e) {}
      }

      initScanner();
    </script>
  </body>
</html>
